name: Release Safari Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (leave empty to run Changesets)"
        required: false
        default: ""
        type: string

env:
  WXT_POSTHOG_API_KEY: ${{ secrets.WXT_POSTHOG_API_KEY || vars.WXT_POSTHOG_API_KEY }}
  WXT_POSTHOG_HOST: ${{ secrets.WXT_POSTHOG_HOST || vars.WXT_POSTHOG_HOST }}
  WXT_ANALYTICS_DAILY_FEATURE_CACHE_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || 'changesets' }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate optional rebuild tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$INPUT_TAG" ]; then
            exit 0
          fi

          version=$(git show "$INPUT_TAG:package.json" | jq -r .version)
          if [ "$INPUT_TAG" != "v$version" ]; then
            echo "::error::Tag $INPUT_TAG does not match package version $version"
            exit 1
          fi

  release:
    name: Prepare release metadata
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    outputs:
      should_package: ${{ steps.metadata.outputs.should_package }}
      tag: ${{ steps.metadata.outputs.tag }}

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        if: inputs.tag == ''
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        if: inputs.tag == ''
        run: pnpm install --frozen-lockfile

      - name: Configure release commit identity
        if: inputs.tag == ''
        shell: bash
        run: |
          git config user.name "stellarjmr"
          git config user.email "219479939+stellarjmr@users.noreply.github.com"

      - name: Create release pull request or tag
        if: inputs.tag == ''
        id: changesets
        uses: changesets/action@v2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          publish-script: pnpm run release
          create-github-releases: true
          push-with-git-cli: true
        env:
          SKIP_FREE_API: true

      - name: Approve trusted Changesets pull request checks
        if: inputs.tag == '' && steps.changesets.outputs.pr-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          pr_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)

          for attempt in {1..10}; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&status=action_required&branch=changeset-release/main&per_page=100" \
              --jq "[.workflow_runs[] | select(
                .head_sha == \"$pr_sha\" and
                .actor.login == \"github-actions[bot]\" and
                (.path == \".github/workflows/pr-test.yml\" or
                 .path == \".github/workflows/changeset-major-warning.yml\")
              ) | {id, path}] | unique_by(.path)")

            if [ "$(jq length <<< "$runs")" -eq 2 ]; then
              jq -r '.[].id' <<< "$runs" | while read -r run_id; do
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
              done
              echo "Approved trusted checks for Changesets PR #$PR_NUMBER at $pr_sha"
              exit 0
            fi

            sleep 3
          done

          echo "::error::Trusted checks for Changesets PR #$PR_NUMBER did not reach approval state"
          exit 1

      - name: Resolve package request
        id: metadata
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "should_package=true" >> "$GITHUB_OUTPUT"
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISHED" = "true" ]; then
            version=$(echo "$PUBLISHED_PACKAGES" | jq -r '.[0].version')
            echo "should_package=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            echo "should_package=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Build and publish unsigned Safari app
    needs: release
    if: needs.release.outputs.should_package == 'true'
    runs-on: macos-latest
    env:
      HUSKY: 0
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and build WebExtension archives
        run: |
          pnpm exec nx fmt:check
          pnpm lint
          SKIP_FREE_API=true pnpm test
          pnpm zip
          pnpm verify:safari

      - name: Build ad-hoc-signed macOS app
        id: macos
        run: node scripts/package-safari-app.mjs --unsigned

      - name: Render Homebrew cask metadata
        run: |
          node scripts/render-homebrew-cask.mjs \
            --version "${{ steps.macos.outputs.version }}" \
            --sha256 "${{ steps.macos.outputs.sha256 }}" \
            --output dist/read-frog.rb

      - name: Upload Safari and Homebrew release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            .output/*-safari.zip \
            .output/*-sources.zip \
            "${{ steps.macos.outputs.artifact_path }}" \
            dist/read-frog.rb \
            --clobber

      - name: Send optional Discord notification
        if: env.DISCORD_WEBHOOK_URL != ''
        shell: bash
        run: |
          jq -n \
            --arg tag "${{ needs.release.outputs.tag }}" \
            --arg url "https://github.com/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag }}" \
            '{content: ("Read Frog " + $tag + " unsigned Homebrew release is ready: " + $url)}' \
            | curl --fail --silent --show-error \
                -H "Content-Type: application/json" \
                -X POST \
                --data-binary @- \
                "$DISCORD_WEBHOOK_URL"
