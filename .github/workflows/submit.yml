name: Package Safari Extension

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g., v1.20.0)"
        required: true
        type: string

env:
  WXT_POSTHOG_API_KEY: ${{ secrets.WXT_POSTHOG_API_KEY || vars.WXT_POSTHOG_API_KEY }}
  WXT_POSTHOG_HOST: ${{ secrets.WXT_POSTHOG_HOST || vars.WXT_POSTHOG_HOST }}
  WXT_ANALYTICS_DAILY_FEATURE_CACHE_ENABLED: "true"

jobs:
  package:
    name: Package Safari WebExtension
    runs-on: macos-latest
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: SKIP_FREE_API=true pnpm test

      - name: Build and Zip Extension
        run: |
          pnpm zip
          pnpm verify:safari

      - name: Upload Extension Zip to Release
        run: gh release upload "${{ inputs.tag }}" .output/*-safari.zip .output/*-sources.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
