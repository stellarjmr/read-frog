name: Test Safari App Packaging

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/submit.yml"
      - "scripts/package-safari-app.mjs"
      - "scripts/render-homebrew-cask.mjs"
      - "scripts/verify-safari-policy.mjs"
      - "wxt.config.ts"
  workflow_dispatch:

env:
  WXT_SKIP_ENV_VALIDATION: true
  HUSKY: 0

jobs:
  package:
    name: Build unsigned app-container smoke artifact
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify unsigned app container
        run: pnpm package:macos:unsigned

      - name: Upload smoke-test app
        uses: actions/upload-artifact@v7
        with:
          name: read-frog-macos-unsigned
          path: dist/*-macos-unsigned.zip
          if-no-files-found: error
