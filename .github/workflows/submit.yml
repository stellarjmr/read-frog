name: Test Safari App Packaging

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/submit.yml"
      - "scripts/package-safari-app.mjs"
      - "scripts/render-homebrew-cask.mjs"
      - "scripts/verify-safari-policy.mjs"
      - "wxt.config.ts"
  workflow_dispatch:

env:
  WXT_SKIP_ENV_VALIDATION: true
  HUSKY: 0

jobs:
  package:
    name: Build unsigned app-container smoke artifact
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify Safari WebExtension
        run: |
          pnpm build
          pnpm verify:safari

      - name: Create ephemeral code-signing identity
        shell: bash
        run: |
          signing_directory="$RUNNER_TEMP/read-frog-signing-smoke"
          keychain_path="$signing_directory/self-signed.keychain-db"
          keychain_password="read-frog-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          identity="Read Frog CI Code Signing"

          mkdir -p "$signing_directory"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$signing_directory/key.pem" \
            -out "$signing_directory/cert.pem" \
            -subj "/CN=$identity/OU=READFROGCI/O=Read Frog CI/C=US" \
            -addext "basicConstraints=critical,CA:true" \
            -addext "keyUsage=critical,digitalSignature,keyCertSign" \
            -addext "extendedKeyUsage=codeSigning"
          openssl pkcs12 -export \
            -inkey "$signing_directory/key.pem" \
            -in "$signing_directory/cert.pem" \
            -out "$signing_directory/cert.p12" \
            -passout "pass:$keychain_password" \
            -keypbe PBE-SHA1-3DES \
            -certpbe PBE-SHA1-3DES \
            -macalg sha1

          echo "::notice::Creating temporary keychain"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          echo "::notice::Importing temporary signing identity"
          security import "$signing_directory/cert.p12" \
            -k "$keychain_path" \
            -P "$keychain_password" \
            -A -t agg -f pkcs12
          echo "::notice::Trusting temporary signing identity"
          sudo -n security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain \
            "$signing_directory/cert.pem"
          echo "::notice::Authorizing codesign key access"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identities=$(security find-identity -v -p codesigning "$keychain_path")
          grep -Fq "$identity" <<< "$identities"

          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=READFROGCI" >> "$GITHUB_ENV"

      - name: Exercise signed Xcode build path
        shell: bash
        run: |
          node scripts/package-safari-app.mjs --signed

          app_path="build/safari-app/release/Read Frog.app"
          extension_path=$(find "$app_path/Contents/PlugIns" -name '*.appex' -type d -print -quit)
          test -d "$app_path"
          test -n "$extension_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=4 "$app_path" 2>&1 | grep -Fq "runtime"
          codesign --display --verbose=4 "$extension_path" 2>&1 | grep -Fq "runtime"

      - name: Remove ephemeral code-signing identity
        if: always()
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/read-frog-signing-smoke/cert.pem"
          if [ -f "$certificate_path" ]; then
            certificate_hash=$(openssl x509 \
              -in "$certificate_path" \
              -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
            sudo -n security delete-certificate \
              -Z "$certificate_hash" \
              /Library/Keychains/System.keychain \
              >/dev/null 2>&1 || true
          fi
          security delete-keychain \
            "$RUNNER_TEMP/read-frog-signing-smoke/self-signed.keychain-db" \
            2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/read-frog-signing-smoke/key.pem" \
            "$RUNNER_TEMP/read-frog-signing-smoke/cert.pem" \
            "$RUNNER_TEMP/read-frog-signing-smoke/cert.p12"

      - name: Build and verify unsigned app container
        run: node scripts/package-safari-app.mjs --unsigned

      - name: Upload smoke-test app
        uses: actions/upload-artifact@v7
        with:
          name: read-frog-macos-unsigned
          path: dist/*-macos-unsigned.zip
          if-no-files-found: error
