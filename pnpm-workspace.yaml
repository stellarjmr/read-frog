minimumReleaseAge: 0

# WXT's optional `web-ext` peer is only needed for non-Safari runners. Safari
# uses WXT's manual-loading runner, so do not auto-install unused peers.
autoInstallPeers: false

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - react-redux@9.2.0
  - reselect@5.1.1
  - semver@6.3.1

allowBuilds:
  core-js: true
  esbuild: true
  msw: true
  nx: true
  spawn-sync: true
